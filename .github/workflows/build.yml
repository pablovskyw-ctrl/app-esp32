name: Compilar APK ESP32

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Configurar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'

      - name: Construir aplicacion
        run: |
          mkdir app_temp
          cd app_temp
          flutter create --org com.pablo esp32_app
          cd esp32_app
          flutter pub add flutter_bluetooth_serial:0.4.0 permission_handler:10.4.5
          cp -f $GITHUB_WORKSPACE/lib/main.dart lib/main.dart
          
          # Agregar permisos de Bluetooth al AndroidManifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          
          flutter build apk --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/Control_ESP32.apk

      - name: Subir APK terminada
        uses: actions/upload-artifact@v4
        with:
          name: Control_ESP32_APK
          path: Control_ESP32.apk
